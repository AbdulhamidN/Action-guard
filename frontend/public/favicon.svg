<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Shield -->
  <path d="M32 4 L54 13.5 C54 38 43.5 52 32 59 C20.5 52 10 38 10 13.5 Z" fill="#0B0F19" stroke="url(#shieldGrad)" stroke-width="3" filter="url(#glow)"/>
  <!-- Inner Shield Accent -->
  <path d="M32 9 L49 16.5 C49 37 40 48.5 32 54.5 C24 48.5 15 37 15 16.5 Z" fill="rgba(99, 102, 241, 0.12)" stroke="rgba(6, 182, 212, 0.4)" stroke-width="1.5"/>
  <!-- AG Monogram -->
  <text x="32" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.5">AG</text>
</svg>